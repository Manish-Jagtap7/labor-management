<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Profile - LabourGram</title>
    <link rel="stylesheet" href="style.css?v=20">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme.js"></script>
</head>
<body>
    <div class="chai-backdrop"></div>

    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                Labour<span>Gram</span>
            </a>

            <div style="display:flex; align-items:center; gap:0.75rem;">
                <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
                    <i class="fa-regular fa-sun"></i>
                </button>
                <a href="index.html" class="btn btn-secondary btn-sm">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>
        </div>
    </header>

    <main class="worker-profile-wrap">
        <div id="loading" style="text-align:center; padding: 3.5rem;">
            <p style="color:var(--muted-foreground);">Loading profile details...</p>
        </div>
        
        <div id="profileContent" style="display:none;">
            <!-- Profile Hero Card -->
            <div class="card-chai worker-profile-hero">
                <img id="wpImage" src="" alt="Worker profile photo" class="worker-profile-avatar" onerror="this.src='https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?q=80&w=300'">
                
                <div class="worker-profile-info">
                    <h1 id="wpName">Loading...</h1>
                    <div class="profile-role" id="wpRole"></div>

                    <div class="worker-profile-chips">
                        <div class="profile-chip"><i class="fa-solid fa-industry"></i> <span id="wpIndustry"></span></div>
                        <div class="profile-chip"><i class="fa-solid fa-briefcase"></i> <span id="wpExp"></span></div>
                        <div class="profile-chip">
                            <i class="fa-solid fa-location-dot"></i> <span id="wpLoc"></span>
                            <a id="wpMapLink" href="#" target="_blank" rel="noopener" class="btn-map-link" style="margin-left:0.35rem;" title="Open in Google Maps">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> Maps
                            </a>
                        </div>
                        <div class="profile-chip">
                            <i class="fa-solid fa-indian-rupee-sign"></i> <strong id="wpWage" class="profile-wage-highlight" style="font-size:0.95rem;"></strong> / day
                        </div>
                    </div>

                    <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
                        <span id="wpStatus" class="status-tag"></span>
                        <div id="wpAction"></div>
                    </div>
                </div>
            </div>

            <!-- About Section -->
            <div class="card-chai" style="margin-bottom: 1.5rem; padding: 1.75rem; border-radius: var(--radius-xl);">
                <h2 style="font-family:var(--font-display); font-size:1.25rem; font-weight:600; margin-bottom: 0.75rem;">About worker</h2>
                <p id="wpBio" style="color:var(--muted-foreground); line-height:1.6; font-size:0.92rem;"></p>
            </div>

            <!-- Portfolio Section -->
            <div class="card-chai" id="portfolioSection" style="display:none; padding: 1.75rem; border-radius: var(--radius-xl); margin-bottom: 2rem;">
                <h2 style="font-family:var(--font-display); font-size:1.25rem; font-weight:600; margin-bottom: 0.35rem;">Work portfolio</h2>
                <p style="color:var(--muted-foreground); font-size:0.82rem; margin-bottom:1.25rem;">Authentic photos of recent completed site work. Click any photo to zoom.</p>
                <div class="portfolio-grid" id="wpPortfolio" style="grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));"></div>
            </div>
        </div>
    </main>

    <!-- Fullscreen Viewer Modal -->
    <div class="lightbox-modal" id="fsViewer" onclick="closeFullscreen()">
        <button type="button" class="lightbox-close" onclick="closeFullscreen()"><i class="fa-solid fa-xmark"></i></button>
        <img src="" id="fsImage" alt="Portfolio full screen" onclick="event.stopPropagation()">
    </div>

    <!-- Hire Modal (Reused) -->
    <div class="modal-overlay" id="hireModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h2>Send hiring request</h2>
                <button type="button" class="modal-close-btn" onclick="closeAllModals()">&times;</button>
            </div>
            <p class="modal-subtitle">Requesting: <strong id="hireWorkerName" style="color:var(--foreground);"></strong></p>
            <form id="hireForm" onsubmit="handleHireRequest(event)">
                <input type="hidden" id="hireProviderId">
                <input type="hidden" id="hireProfileId">
                <div class="form-group">
                    <label for="hireJobDesc">Job description</label>
                    <textarea id="hireJobDesc" required placeholder="Describe the specific work required, site location, and hours..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="hireDateNeeded">Date needed</label>
                    <input type="date" id="hireDateNeeded" required>
                </div>
                <div class="form-group">
                    <label for="hireWage">Proposed daily wage (₹)</label>
                    <input type="number" id="hireWage" required min="1">
                </div>
                <div class="form-error" id="hireError"></div>
                <button type="submit" class="btn btn-asym btn-full" id="hireBtn" style="margin-top:1rem;">Send request</button>
            </form>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script src="address-autocomplete.js?v=20"></script>
    <script src="script.js?v=20"></script>
    <script src="worker.js?v=20"></script>
</body>
</html>
