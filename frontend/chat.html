<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat - LabourGram</title>
    <link rel="stylesheet" href="style.css?v=20">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme.js"></script>
</head>
<body class="chat-page-layout">
    <div class="chai-backdrop"></div>

    <header class="chat-header">
        <div class="chat-header-title">
            <button type="button" class="btn btn-ghost btn-sm" onclick="if(window.history.length > 1){ window.history.back(); } else { window.location.href='dashboard.html'; }" aria-label="Go back">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="chat-header-user">
                <div class="chat-user-avatar" id="chatParticipantAvatar">
                    <i class="fa-regular fa-user"></i>
                </div>
                <div class="chat-user-meta">
                    <h2 id="chatParticipantName">Loading conversation...</h2>
                    <span id="chatParticipantRole">Connecting</span>
                </div>
            </div>
        </div>

        <div style="display:flex; align-items:center; gap:0.5rem;">
            <a href="#" target="_blank" rel="noopener" id="chatLocationBtn" class="btn-map-link" style="display:none;" title="View participant location on Google Maps">
                <i class="fa-solid fa-location-dot"></i> Maps
            </a>
            <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
                <i class="fa-regular fa-sun"></i>
            </button>
            <a href="dashboard.html" class="btn btn-secondary btn-sm">
                Dashboard
            </a>
        </div>
    </header>

    <!-- Job Summary Strip -->
    <div class="chat-job-banner" id="chatJobBanner" style="display:none;"></div>

    <main class="chat-messages" id="chatMessages">
        <p style="text-align:center; color:var(--muted-foreground); margin:auto; font-size:0.9rem;">Connecting to chat...</p>
    </main>

    <form class="chat-input-area" id="chatForm">
        <input type="text" id="chatInput" placeholder="Write a message..." required autocomplete="off">
        <button type="submit" class="chat-send-btn" aria-label="Send message">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </form>
    
    <div class="toast" id="toast"></div>

    <script src="chat.js?v=20"></script>
</body>
</html>
