<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LabourGram</title>
    <link rel="stylesheet" href="style.css?v=20">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme.js"></script>
</head>
<body class="dash-layout">
    <div class="chai-backdrop"></div>

    <!-- Dashboard Top Bar -->
    <header class="dash-header-bar">
        <a href="index.html" class="dash-back-link">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Labour<strong>Gram</strong></span>
        </a>

        <div style="display:flex; align-items:center; gap:0.75rem;">
            <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
                <i class="fa-regular fa-sun"></i>
            </button>
            <div id="dashUserInfo" style="font-size:0.85rem; color:var(--muted-foreground);"></div>
            <button type="button" id="dashAdminBtn" class="btn btn-secondary btn-sm" style="display:none;" onclick="window.location.href='admin.html'">
                <i class="fa-solid fa-shield-halved"></i> Admin panel
            </button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="logoutUser()" title="Logout" style="color:var(--status-danger);">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>
    
    <div class="dash-container">
        <!-- Sidebar Navigation -->
        <aside class="dash-sidebar">
            <button type="button" class="dash-tab-btn active" onclick="switchTab('chats')" id="tab-chats">
                <i class="fa-regular fa-message"></i>
                <span>Chats & requests</span>
                <span class="dash-badge hidden" id="dashBadge">0</span>
            </button>
            <button type="button" class="dash-tab-btn" onclick="switchTab('profile')" id="tab-profile">
                <i class="fa-regular fa-user"></i>
                <span>My profile</span>
            </button>
        </aside>
        
        <!-- Main Content Pane -->
        <main class="dash-main">
            <!-- Dynamic Profile Approval Status Banner -->
            <div id="profileApprovalBanner"></div>

            <!-- CHATS SECTION -->
            <section id="sec-chats" class="dash-section-pane active">
                <div style="margin-bottom:1.25rem;">
                    <h2 style="font-family:var(--font-display); font-size:1.35rem; font-weight:600;">Active requests & chats</h2>
                    <p style="color:var(--muted-foreground); font-size:0.85rem;">Manage incoming job requests, coordinate work dates, and chat directly.</p>
                </div>
                <div id="chatsListContainer">
                    <p style="color:var(--muted-foreground); text-align:center; padding:2rem;">Loading requests...</p>
                </div>
            </section>
            
            <!-- PROFILE SECTION -->
            <section id="sec-profile" class="dash-section-pane">
                <div style="margin-bottom:1.25rem;">
                    <h2 style="font-family:var(--font-display); font-size:1.35rem; font-weight:600;">Profile details</h2>
                    <p style="color:var(--muted-foreground); font-size:0.85rem;">Keep your trade skills, location, wage rates, and identity documents current.</p>
                </div>

                <div class="card-chai" style="max-width: 650px; padding: 1.75rem; border-radius: var(--radius-xl);">
                    <div class="pfp-upload-container">
                        <div class="pfp-circle" onclick="document.getElementById('pfpInput').click()" title="Click to upload profile photo">
                            <img id="pfpPreview" src="" style="display:none;" alt="Profile photo preview">
                            <i id="pfpPlaceholder" class="fa-solid fa-camera"></i>
                            <div class="pfp-overlay">Upload</div>
                        </div>
                        <input type="file" id="pfpInput" style="display:none;" accept="image/png, image/jpeg, image/webp" onchange="handlePfpUpload(event)">
                        <span style="margin-top:0.5rem; font-size:0.8rem; color:var(--muted-foreground);">Profile photo</span>
                    </div>

                    <form id="profileForm" onsubmit="updateProfile(event)">
                        <div id="profileFormFields">
                            <!-- Filled dynamically by dashboard.js -->
                        </div>
                        <button type="submit" id="profSubmitBtn" class="btn btn-asym btn-full" style="margin-top: 1.5rem;">
                            Update profile
                        </button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <!-- Fullscreen Lightbox Modal -->
    <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
        <button type="button" class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <img id="lightboxImg" src="" alt="Document preview" onclick="event.stopPropagation()">
    </div>

    <div class="toast" id="toast"></div>
    <script src="address-autocomplete.js?v=20"></script>
    <script src="dashboard.js?v=20"></script>
</body>
</html>
